<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:0;font-family:var(--font-body);color:#3F3F46}
.hero{padding:36px 32px;background:linear-gradient(135deg,#5029A3 0%,#8B55FE 60%,#C3B1FF 100%);color:#fff;position:relative;overflow:hidden}
.eye{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
.h1{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:-0.02em;margin:0 0 8px;max-width:80%}
.h1 em{font-style:normal;color:#A685FF;background:rgba(255,255,255,.0);position:relative;display:inline-block}
.h1 em::after{content:'';position:absolute;left:-4px;right:-4px;bottom:2px;height:10px;background:rgba(255,255,255,.18);z-index:-1;border-radius:8px}
.sub{font-size:14px;opacity:.9;margin:0;max-width:60%}
.cta{display:inline-flex;gap:10px;margin-top:14px}
.btn{font-weight:600;font-size:13px;padding:10px 18px;border-radius:9999px;border:none;cursor:pointer}
.p{background:#fff;color:#8B55FE}
.g{background:transparent;border:1.5px solid rgba(255,255,255,.7);color:#fff}
.arrow{position:absolute;right:-12px;top:32px;width:80px;opacity:.7}
.star{position:absolute;right:36px;bottom:18px;width:24px}
</style></head><body>
<div class="hero">
  <div class="eye">Aliado estratégico</div>
  <h1 class="h1">Desarrolla el <em>talento</em> de tu equipo en menos tiempo</h1>
  <p class="sub">Crea cursos con IA, mapea competencias y mide el impacto. En una sola plataforma hecha para LATAM.</p>
  <div class="cta">
    <button class="btn p">Agendar demo →</button>
    <button class="btn g">Ver caso Mazda</button>
  </div>
  <img class="arrow" src="../assets/decor/arrow-curve-violet.svg" alt="">
  <img class="star" src="../assets/decor/star.svg" alt="">
</div>
</body></html>
