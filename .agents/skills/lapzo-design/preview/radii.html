<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#F8FAFC;font-family:var(--font-body);color:#3F3F46}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;text-align:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px}
.swatch{background:#fff;border:1.5px solid #E2E2E8;width:64px;height:64px}
.name{font-family:var(--font-display);font-weight:700;color:#240C50;font-size:12px}
.val{font-size:10px;color:#71717A;font-family:ui-monospace,monospace}
</style></head><body>
<div class="row">
  <div class="cell"><div class="swatch" style="border-radius:4px"></div><div class="name">xs</div><div class="val">4px</div></div>
  <div class="cell"><div class="swatch" style="border-radius:8px"></div><div class="name">sm</div><div class="val">8px</div></div>
  <div class="cell"><div class="swatch" style="border-radius:12px"></div><div class="name">md</div><div class="val">12px</div></div>
  <div class="cell"><div class="swatch" style="border-radius:16px"></div><div class="name">lg</div><div class="val">16px</div></div>
  <div class="cell"><div class="swatch" style="border-radius:24px"></div><div class="name">2xl</div><div class="val">24px</div></div>
  <div class="cell"><div class="swatch" style="border-radius:9999px"></div><div class="name">pill</div><div class="val">9999</div></div>
</div>
<p style="margin:18px 0 0;font-size:11px;color:#71717A;font-style:italic;text-align:center">md = fotos / mockups · lg = cards · 2xl = cajas IA · pill = botones</p>
</body></html>
