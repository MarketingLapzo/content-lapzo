<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#FAFAFC;font-family:var(--font-body)}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.s{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:500;line-height:1.1}
.s.dark-text{color:#012D33}
.s .h{font-family:var(--font-display);font-weight:700;font-size:13px}
.s .c{opacity:.85;font-family:ui-monospace,monospace;font-size:9.5px}
</style></head><body>
<div class="row">
  <div class="s" style="background:#012D33"><div class="h">darkest</div><div class="c">#012D33</div></div>
  <div class="s" style="background:#0F4C52"><div class="h">dark</div><div class="c">#0F4C52</div></div>
  <div class="s" style="background:#0C5C63"><div class="h">mid</div><div class="c">#0C5C63</div></div>
  <div class="s" style="background:#04949D"><div class="h">teal ★</div><div class="c">#04949D</div></div>
  <div class="s" style="background:#08BEC4"><div class="h">light</div><div class="c">#08BEC4</div></div>
  <div class="s dark-text" style="background:#21DDE0"><div class="h">mint</div><div class="c">#21DDE0</div></div>
  <div class="s dark-text" style="background:#54F4F2"><div class="h">bright</div><div class="c">#54F4F2</div></div>
  <div class="s dark-text" style="background:#92FDF7"><div class="h">pastel</div><div class="c">#92FDF7</div></div>
  <div class="s dark-text" style="background:#C9FEFB"><div class="h">soft</div><div class="c">#C9FEFB</div></div>
  <div class="s dark-text" style="background:#EFFEFC;border:1px solid #E2E2E8"><div class="h">min</div><div class="c">#EFFEFC</div></div>
  <div class="s" style="background:#08757D"><div class="h">700</div><div class="c">#08757D</div></div>
  <div class="s" style="background:#01DA8C"><div class="h">accent</div><div class="c">#01DA8C</div></div>
</div>
</body></html>
