<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#FAFAFC;font-family:var(--font-body)}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.s{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:500;line-height:1.1}
.s.dark-text{color:#240C50}
.s .h{font-family:var(--font-display);font-weight:700;font-size:13px}
.s .c{opacity:.85;font-family:ui-monospace,monospace;font-size:9.5px}
</style></head><body>
<div class="row">
  <div class="s" style="background:#240C50"><div class="h">darkest</div><div class="c">#240C50</div></div>
  <div class="s" style="background:#5029A3"><div class="h">dark</div><div class="c">#5029A3</div></div>
  <div class="s" style="background:#7D31F6"><div class="h">brand</div><div class="c">#7D31F6</div></div>
  <div class="s" style="background:#8B55FE"><div class="h">violet ★</div><div class="c">#8B55FE</div></div>
  <div class="s" style="background:#A685FF"><div class="h">light</div><div class="c">#A685FF</div></div>
  <div class="s dark-text" style="background:#C3B1FF"><div class="h">pastel-1</div><div class="c">#C3B1FF</div></div>
  <div class="s dark-text" style="background:#DDD4FF"><div class="h">pastel-2</div><div class="c">#DDD4FF</div></div>
  <div class="s dark-text" style="background:#ECE8FF"><div class="h">pastel-3</div><div class="c">#ECE8FF</div></div>
  <div class="s dark-text" style="background:#F5F2FF;border:1px solid #E2E2E8"><div class="h">soft</div><div class="c">#F5F2FF</div></div>
  <div class="s" style="background:#5B19BE"><div class="h">mid</div><div class="c">#5B19BE</div></div>
  <div class="s" style="background:#6E1FE2"><div class="h">700</div><div class="c">#6E1FE2</div></div>
  <div class="s dark-text" style="background:#FFFFFF;border:1px solid #E2E2E8"><div class="h">white</div><div class="c">#FFFFFF</div></div>
</div>
</body></html>
