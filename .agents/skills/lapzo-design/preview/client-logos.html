<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:20px;background:#fff;font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.cell{background:#F7F7FC;border-radius:8px;aspect-ratio:1.4;display:flex;align-items:center;justify-content:center;padding:8px;position:relative}
.cell img{max-width:80%;max-height:60%}
.name{position:absolute;bottom:4px;left:6px;right:6px;font-size:9.5px;color:#71717A;font-family:ui-monospace,monospace;text-align:center}
</style></head><body>
<div class="grid">
  <div class="cell"><img src="../assets/client-logos/mazda.svg"><span class="name">mazda</span></div>
  <div class="cell"><img src="../assets/client-logos/rotoplas.svg"><span class="name">rotoplas</span></div>
  <div class="cell"><img src="../assets/client-logos/oxxo.svg"><span class="name">oxxo</span></div>
  <div class="cell"><img src="../assets/client-logos/nestle.svg"><span class="name">nestle</span></div>
  <div class="cell"><img src="../assets/client-logos/sephora.svg"><span class="name">sephora</span></div>
  <div class="cell"><img src="../assets/client-logos/tecmilenio.svg"><span class="name">tecmilenio</span></div>
  <div class="cell"><img src="../assets/client-logos/bbva.svg"><span class="name">bbva</span></div>
  <div class="cell"><img src="../assets/client-logos/farmacias-del-ahorro.svg"><span class="name">f. ahorro</span></div>
  <div class="cell"><img src="../assets/client-logos/deacero.svg"><span class="name">deacero</span></div>
  <div class="cell"><img src="../assets/client-logos/construrama.svg"><span class="name">construrama</span></div>
  <div class="cell"><img src="../assets/client-logos/berel.svg"><span class="name">berel</span></div>
  <div class="cell"><img src="../assets/client-logos/gonher.svg"><span class="name">gonher</span></div>
  <div class="cell"><img src="../assets/client-logos/gonher-mark.svg"><span class="name">gonher-mark</span></div>
  <div class="cell"><img src="../assets/client-logos/deacero-alt.svg"><span class="name">deacero-alt</span></div>
</div>
<p style="margin:12px 0 0;font-size:11px;color:#71717A;font-style:italic;text-align:center">14 logos identificados + 15 sin nombre en assets/client-logos/misc/ pendientes de identificar</p>
</body></html>
