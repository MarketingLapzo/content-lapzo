<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#FFFFFF;font-family:var(--font-body);color:#3F3F46}
.row{display:grid;grid-template-columns:90px 1fr 140px;gap:18px;align-items:baseline;padding:14px 0;border-bottom:1px solid #EFF0F6}
.row:last-child{border-bottom:0}
.label{font-size:11px;color:#71717A;font-family:ui-monospace,monospace;text-transform:uppercase;letter-spacing:.05em}
.meta{font-size:11px;color:#71717A;text-align:right;font-family:ui-monospace,monospace}
.sample{font-family:var(--font-display);color:#240C50;text-wrap:balance}
.h1{font-weight:700;font-size:48px;line-height:1.0;letter-spacing:-0.02em}
.h2{font-family:var(--font-body);font-weight:600;font-size:32px;line-height:1.2;letter-spacing:-0.01em}
.h3{font-family:var(--font-body);font-weight:500;font-size:24px;line-height:1.3}
.h4{font-family:var(--font-body);font-weight:500;font-size:18px;line-height:1.4}
</style></head><body>
<div class="row">
  <div class="label">H1</div>
  <div class="sample h1">Desarrolla el talento</div>
  <div class="meta">Space Grotesk · 700 · 48–64</div>
</div>
<div class="row">
  <div class="label">H2</div>
  <div class="sample h2">Tu aliado estratégico</div>
  <div class="meta">Poppins · 600 · 32</div>
</div>
<div class="row">
  <div class="label">H3</div>
  <div class="sample h3">Capacitación y aprendizaje</div>
  <div class="meta">Poppins · 500 · 24</div>
</div>
<div class="row">
  <div class="label">H4</div>
  <div class="sample h4">Crea cursos con IA en minutos</div>
  <div class="meta">Poppins · 500 · 18</div>
</div>
</body></html>
