<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#F8FAFC;font-family:var(--font-body);color:#3F3F46}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.cell{background:#fff;border:1px solid #EFF0F6;border-radius:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:12px;position:relative}
.cell img{max-width:80%;max-height:70%}
.name{position:absolute;bottom:6px;left:8px;font-size:9.5px;color:#71717A;font-family:ui-monospace,monospace}
</style></head><body>
<div class="grid">
  <div class="cell"><img src="../assets/decor/arrow-loop-teal.svg"><span class="name">loop</span></div>
  <div class="cell"><img src="../assets/decor/arrow-curve-violet.svg"><span class="name">curve-violet</span></div>
  <div class="cell"><img src="../assets/decor/arrow-curve-orange.svg"><span class="name">curve-orange</span></div>
  <div class="cell"><img src="../assets/decor/arrow-small-violet-1.svg"><span class="name">small-1</span></div>
  <div class="cell"><img src="../assets/decor/arrow-curve-dark.svg"><span class="name">curve-dark</span></div>
  <div class="cell"><img src="../assets/decor/arrow-line-pink.svg"><span class="name">line-pink</span></div>
  <div class="cell"><img src="../assets/decor/swoosh-violet.svg"><span class="name">swoosh-violet</span></div>
  <div class="cell"><img src="../assets/decor/swoosh-teal.svg"><span class="name">swoosh-teal</span></div>
  <div class="cell"><img src="../assets/decor/wave-teal.svg"><span class="name">wave-teal</span></div>
  <div class="cell"><img src="../assets/decor/circle-loose-violet.svg"><span class="name">circle-violet</span></div>
  <div class="cell"><img src="../assets/decor/circle-loose-teal.svg"><span class="name">circle-teal</span></div>
  <div class="cell"><img src="../assets/decor/squiggle-line-teal.svg"><span class="name">squiggle</span></div>
  <div class="cell"><img src="../assets/decor/star.svg"><span class="name">star</span></div>
  <div class="cell"><img src="../assets/decor/flower.svg"><span class="name">flower</span></div>
  <div class="cell"><img src="../assets/decor/flower-thin.svg"><span class="name">flower-thin</span></div>
  <div class="cell"><img src="../assets/decor/plus.svg"><span class="name">plus</span></div>
  <div class="cell"><img src="../assets/decor/arrow-small-violet-2.svg"><span class="name">small-2</span></div>
  <div class="cell"><img src="../assets/decor/arrow-vert-pink.svg" style="max-height:90%"><span class="name">vert-pink</span></div>
</div>
</body></html>
