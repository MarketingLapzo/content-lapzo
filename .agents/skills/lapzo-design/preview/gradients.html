<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#FAFAFC;font-family:var(--font-body)}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.g{aspect-ratio:2.2;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;padding:14px;color:#fff}
.g .name{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1}
.g .stops{display:flex;gap:6px;font-family:ui-monospace,monospace;font-size:9.5px;opacity:.85}
</style></head><body>
<div class="row">
  <div class="g" style="background:var(--gradient-brand)"><div class="name">brand</div><div class="stops"><span>#5029A3</span>→<span>#8B55FE</span>→<span>#C3B1FF</span></div></div>
  <div class="g" style="background:var(--gradient-ia)"><div class="name" style="color:#240C50">ia</div><div class="stops" style="color:#240C50"><span>#A685FF</span>→<span>#DDD4FF</span></div></div>
  <div class="g" style="background:var(--gradient-teal)"><div class="name" style="color:#012D33">teal</div><div class="stops" style="color:#012D33"><span>#04949D</span>→<span>#21DDE0</span>→<span>#92FDF7</span></div></div>
  <div class="g" style="background:var(--gradient-warm)"><div class="name" style="color:#3F3F46">warm</div><div class="stops" style="color:#3F3F46"><span>#F9912A</span>→<span>#FBBE81</span>→<span>#FDE0C3</span></div></div>
  <div class="g" style="background:var(--gradient-brand-soft)"><div class="name" style="color:#240C50">brand-soft</div><div class="stops" style="color:#240C50"><span>#8B55FE</span>→<span>#C3B1FF</span>→<span>#ECE8FF</span></div></div>
  <div class="g" style="background:var(--gradient-pink)"><div class="name">pink</div><div class="stops"><span>#F3538E</span>→<span>#F9A6C4</span>→<span>#FFD3E3</span></div></div>
</div>
</body></html>
