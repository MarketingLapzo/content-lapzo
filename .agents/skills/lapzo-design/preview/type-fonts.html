<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#F8FAFC;font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.col{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.col h4{margin:0 0 6px;font-family:var(--font-display);font-weight:700;color:#240C50;font-size:15px}
.col p{margin:0 0 14px;font-size:11px;color:#71717A;font-style:italic}
.specimen{font-family:var(--font-display);font-weight:700;color:#240C50;font-size:54px;line-height:1;letter-spacing:-0.02em;margin-bottom:8px}
.specimen2{font-family:var(--font-body);font-weight:600;color:#240C50;font-size:42px;line-height:1.05;letter-spacing:-0.01em;margin-bottom:8px}
.range{display:flex;gap:10px;flex-wrap:wrap}
.range span{font-size:11px;color:#71717A;font-family:ui-monospace,monospace;background:#F5F2FF;padding:3px 8px;border-radius:6px}
</style></head><body>
<div class="grid">
  <div class="col">
    <h4>Space Grotesk</h4>
    <p>Solo H1 — carácter tech, IA, datos</p>
    <div class="specimen">Aa Bb Cc</div>
    <div class="range"><span>Bold 700</span><span>SemiBold 600</span><span>Medium 500</span></div>
  </div>
  <div class="col">
    <h4>Poppins</h4>
    <p>Subtítulos, copy, UI — amigable, geométrica · local TTF</p>
    <div class="specimen2">Aa Bb Cc</div>
    <div class="range"><span>Black 900</span><span>ExtraBold 800</span><span>Bold 700</span><span>SemiBold 600</span><span>Medium 500</span><span>Regular 400</span><span>Light 300</span><span>ExtraLight 200</span><span>Thin 100</span></div>
  </div>
</div>
</body></html>
