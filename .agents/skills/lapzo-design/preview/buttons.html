<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#F8FAFC;font-family:var(--font-body);color:#3F3F46}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1;display:inline-flex;align-items:center;gap:8px;border-radius:9999px;border:none;cursor:pointer;transition:all .15s ease}
.btn-primary{background:#8B55FE;color:#fff;padding:14px 24px}
.btn-primary:hover{background:#7D31F6}
.btn-ghost{background:transparent;border:1.5px solid #8B55FE;color:#8B55FE;padding:13px 23px;font-weight:500}
.btn-ghost:hover{background:#F5F2FF}
.btn-dark{background:#14142A;color:#fff;padding:14px 24px}
.btn-sm{padding:8px 16px;font-size:14px}
.btn-lg{padding:18px 32px;font-size:18px}
.label{font-size:10px;color:#71717A;font-family:ui-monospace,monospace;text-transform:uppercase;letter-spacing:.05em;width:60px}
</style></head><body>
<div class="row"><span class="label">primary</span>
  <button class="btn btn-primary btn-sm">Ver más</button>
  <button class="btn btn-primary">Agendar demo</button>
  <button class="btn btn-primary btn-lg">Conoce Lapzo →</button>
</div>
<div class="row"><span class="label">ghost</span>
  <button class="btn btn-ghost btn-sm">Cancelar</button>
  <button class="btn btn-ghost">Saber más</button>
</div>
<div class="row"><span class="label">dark</span>
  <button class="btn btn-dark">Solicita diagnóstico</button>
</div>
</body></html>
