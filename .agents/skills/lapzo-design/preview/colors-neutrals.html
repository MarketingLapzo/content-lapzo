<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#FAFAFC;font-family:var(--font-body)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.s{aspect-ratio:1.2;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10.5px;line-height:1.1}
.s.lt{background:#fff;border:1px solid #E2E2E8;color:#3F3F46}
.s .h{font-weight:600;font-size:12px}
.s .c{opacity:.7;font-family:ui-monospace,monospace;font-size:9.5px}
</style></head><body>
<div class="row">
  <div class="s" style="background:#3F3F46;color:#fff"><div class="h">ink</div><div class="c">#3F3F46</div></div>
  <div class="s" style="background:#475569;color:#fff"><div class="h">ink-3</div><div class="c">#475569</div></div>
  <div class="s" style="background:#71717A;color:#fff"><div class="h">ink-2</div><div class="c">#71717A</div></div>
  <div class="s" style="background:#94A3B8;color:#fff"><div class="h">ink-4</div><div class="c">#94A3B8</div></div>
  <div class="s lt"><div class="h">border</div><div class="c">#E2E2E8</div></div>
</div>
<div class="row">
  <div class="s lt" style="background:#EFF0F6"><div class="h">border-soft</div><div class="c">#EFF0F6</div></div>
  <div class="s lt" style="background:#F7F7FC"><div class="h">bg-soft</div><div class="c">#F7F7FC</div></div>
  <div class="s lt" style="background:#F8FAFC"><div class="h">bg-page</div><div class="c">#F8FAFC</div></div>
  <div class="s lt" style="background:#FFFFFF"><div class="h">white</div><div class="c">#FFFFFF</div></div>
  <div class="s" style="background:#14142A;color:#fff"><div class="h">bg-dark</div><div class="c">#14142A</div></div>
</div>
</body></html>
