<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-body)}
.row{display:flex;align-items:center;gap:16px;padding:8px 0;border-bottom:1px solid #EFF0F6}
.row:last-child{border-bottom:0}
.bar{height:8px;background:#8B55FE;border-radius:4px}
.name{font-family:var(--font-display);font-weight:700;color:#240C50;width:48px;font-size:12px}
.val{font-size:11px;color:#71717A;font-family:ui-monospace,monospace;width:48px}
</style></head><body>
<div class="row"><span class="name">1</span><div class="bar" style="width:4px"></div><span class="val">4px</span></div>
<div class="row"><span class="name">2</span><div class="bar" style="width:8px"></div><span class="val">8px</span></div>
<div class="row"><span class="name">3</span><div class="bar" style="width:12px"></div><span class="val">12px</span></div>
<div class="row"><span class="name">4</span><div class="bar" style="width:16px"></div><span class="val">16px</span></div>
<div class="row"><span class="name">5</span><div class="bar" style="width:20px"></div><span class="val">20px</span></div>
<div class="row"><span class="name">6</span><div class="bar" style="width:24px"></div><span class="val">24px</span></div>
<div class="row"><span class="name">8</span><div class="bar" style="width:32px"></div><span class="val">32px</span></div>
<div class="row"><span class="name">10</span><div class="bar" style="width:40px"></div><span class="val">40px</span></div>
<div class="row"><span class="name">12</span><div class="bar" style="width:48px"></div><span class="val">48px</span></div>
<div class="row"><span class="name">16</span><div class="bar" style="width:64px"></div><span class="val">64px</span></div>
<div class="row"><span class="name">20</span><div class="bar" style="width:80px"></div><span class="val">80px</span></div>
</body></html>
