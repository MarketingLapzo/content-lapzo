<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#FAFAFC;font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fam{display:flex;flex-direction:column;gap:4px}
.label{font-size:11px;font-weight:600;color:#240C50;font-family:var(--font-body);text-transform:lowercase;letter-spacing:.02em;margin-bottom:2px}
.row{display:flex;gap:4px}
.s{flex:1;height:48px;border-radius:8px;display:flex;align-items:flex-end;padding:4px 6px;font-size:9px;font-family:ui-monospace,monospace;color:rgba(0,0,0,.6)}
.s.on-dark{color:rgba(255,255,255,.85)}
</style></head><body>
<div class="grid">
  <div class="fam"><div class="label">rosa</div>
    <div class="row">
      <div class="s on-dark" style="background:#F3538E">F3538E</div>
      <div class="s" style="background:#F9A6C4">F9A6C4</div>
      <div class="s" style="background:#FFD3E3">FFD3E3</div>
    </div>
  </div>
  <div class="fam"><div class="label">naranja</div>
    <div class="row">
      <div class="s on-dark" style="background:#F9912A">F9912A</div>
      <div class="s" style="background:#FBBE81">FBBE81</div>
      <div class="s" style="background:#FDE0C3">FDE0C3</div>
    </div>
  </div>
  <div class="fam"><div class="label">azul</div>
    <div class="row">
      <div class="s on-dark" style="background:#2F80ED">2F80ED</div>
      <div class="s on-dark" style="background:#7FB2F0">7FB2F0</div>
      <div class="s" style="background:#D6E6FB">D6E6FB</div>
    </div>
  </div>
  <div class="fam"><div class="label">amarillo</div>
    <div class="row">
      <div class="s" style="background:#F2C94C">F2C94C</div>
      <div class="s" style="background:#F7DEBA">F7DEBA</div>
      <div class="s" style="background:#FFF3CC">FFF3CC</div>
    </div>
  </div>
</div>
<p style="margin:16px 0 0;font-size:11px;color:#71717A;font-style:italic">Máx. 20% de presencia en cualquier pieza. Nunca como fondo principal.</p>
</body></html>
